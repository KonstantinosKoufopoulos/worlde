name: leximera
description: "Λεξήμερα — Greek daily word game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_mobile_ads: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/answers.json
    - assets/dict/guesses.json
    - assets/dict/etymology.json
    - assets/dict/packs/mythology/answers.json
    - assets/dict/packs/mythology/guesses.json
    - assets/dict/packs/mythology/etymology.json
    - assets/dict/packs/mythology/meta.json
    - assets/dict/packs/cities/answers.json
    - assets/dict/packs/cities/guesses.json
    - assets/dict/packs/cities/etymology.json
    - assets/dict/packs/cities/meta.json
    - assets/dict/packs/food/answers.json
    - assets/dict/packs/food/guesses.json
    - assets/dict/packs/food/etymology.json
    - assets/dict/packs/food/meta.json
