name: leximera
description: "Λεξήμερα — Greek daily word game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_mobile_ads: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/dict/answers.json
    - assets/dict/guesses.json
    - assets/dict/etymology.json
    - assets/dict/packs/mythology/answers.json
    - assets/dict/packs/mythology/guesses.json
    - assets/dict/packs/mythology/etymology.json
    - assets/dict/packs/mythology/meta.json
    - assets/dict/packs/cities/answers.json
    - assets/dict/packs/cities/guesses.json
    - assets/dict/packs/cities/etymology.json
    - assets/dict/packs/cities/meta.json
    - assets/dict/packs/food/answers.json
    - assets/dict/packs/food/guesses.json
    - assets/dict/packs/food/etymology.json
    - assets/dict/packs/food/meta.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon-legacy-1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#123B29"
  adaptive_icon_foreground: "assets/icon/icon-adaptive-foreground-1024.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/icon-adaptive-monochrome-1024.png"
  web:
    generate: true
    image_path: "assets/icon/icon-legacy-1024.png"
    background_color: "#F5FBF5"
    theme_color: "#226A4C"
